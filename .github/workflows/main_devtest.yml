name: CI/CD Node.js with Cypress - DevTest

on:
  push:
    branches:
      - main
      - Dev # Ajustado a tu nombre real de rama
  pull_request:
    branches:
      - main
      - Dev
  workflow_dispatch:

env:
  # Esto quita el warning de Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_test:
    name: Build + Cypress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Tu app puede seguir en 20, no hay problema
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          CI: false  # <-- Esto evita que los warnings detengan el build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome

      - name: Prepare deployment package
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p deploy-package
          cp -r build deploy-package/build
          cp app.js deploy-package/app.js
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          cp web.config deploy-package/web.config
          cp -r middleware deploy-package/middleware

      - name: Upload deploy artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: node-app-deploy
          path: deploy-package
          if-no-files-found: error

      # Estos pasos solo se ejecutan si lo de arriba falla o termina
      - name: Upload artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  deploy_azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'Dev')

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-deploy
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DevTest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
