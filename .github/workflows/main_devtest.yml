name: CI/CD Node.js with Cypress - DevTest

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_test:
    name: Build + Cypress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          CI: false

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/integracion-*.cy.js

      # Optimización: Preparar node_modules de producción para evitar npm install en Azure
      - name: Prepare production dependencies
        if: success() && github.event_name == 'push'
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Prepare deployment package
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p deploy-package
          cp -r build deploy-package/build
          cp -r node_modules deploy-package/node_modules
          cp app.js deploy-package/app.js
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          cp web.config deploy-package/web.config
          cp -r middleware deploy-package/middleware

      - name: Upload deploy artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: node-app-deploy
          path: deploy-package
          if-no-files-found: error

      - name: Guardar evidencias (Screenshots y Videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  deploy_azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      # Elimina pasos redundantes de compilación; usa el artefacto ya generado
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-deploy
          path: ./deploy-package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DevTest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy-package