name: CI/CD Node.js with Cypress - DevTest

on:
  push:
    branches:
      - main
      - Dev # Ajustado a tu nombre real de rama
  pull_request:
    branches:
      - main
      - Dev
  workflow_dispatch:

env:
  # Esto quita el warning de Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_test:
    name: Build + Cypress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Tu app puede seguir en 20, no hay problema
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          CI: false  # <-- Esto evita que los warnings detengan el build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        env:
          NODE_ENV: test # <-- SOLUCIÓN AL ERROR: Le dice a react-scripts que estamos probando
          # Variables inyectadas para que app.js pueda conectar a la BD
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/integracion-*.cy.js
      # ==========================================
      # RECOMENDACIÓN DE CALIDAD (Evidencias)
      # ==========================================
      - name: Guardar capturas de error de Cypress
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ github.run_attempt }}
          path: cypress/screenshots
          retention-days: 3

      - name: Prepare deployment package
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p deploy-package
          cp -r build deploy-package/build
          cp app.js deploy-package/app.js
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          cp web.config deploy-package/web.config
          cp -r middleware deploy-package/middleware

      # Artifact para uso del job de deploy
      - name: Upload deploy artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: node-app-deploy
          path: deploy-package
          if-no-files-found: error

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Guardar Videos de las Pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

  deploy_azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          CI: false

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r build deploy-package/build
          cp -r public deploy-package/public
          cp -r src deploy-package/src
          cp app.js deploy-package/app.js
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          cp web.config deploy-package/web.config
          cp -r middleware deploy-package/middleware

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DevTest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy-package
