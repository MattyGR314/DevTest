name: Pruebas Unitarias e Integración Dinámicas
# Este workflow se ejecuta en cada push a ramas que sigan el patrón 'Dev_DT_*'. 
on:
  push:
    branches:
      - 'Dev_DT_*'

jobs:
  cypress-dynamic-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Construir la aplicación (Frontend)
        run: npm run build
        env:
          CI: false

      - name: Determinar archivos de prueba según la rama
        id: set-target
        run: |
          RAMA="${{ github.ref_name }}"
          NUMERO=$(echo "$RAMA" | grep -oE '[0-9]+')
          
          ARCHIVO_UNIT="src/**/prueba-unitaria-DT${NUMERO}.cy.*"
          ARCHIVO_INT="cypress/e2e/integracion-DT${NUMERO}.cy.js"
          
          echo "test_file_unit=$ARCHIVO_UNIT" >> $GITHUB_OUTPUT
          echo "test_file_int=$ARCHIVO_INT" >> $GITHUB_OUTPUT
          
          if [ -f "$ARCHIVO_INT" ]; then
            echo "run_integration=true" >> $GITHUB_OUTPUT
          else
            echo "run_integration=false" >> $GITHUB_OUTPUT
          fi

      - name: Ejecutar prueba unitaria (Component Testing)
        uses: cypress-io/github-action@v6
        with:
          install: false 
          component: true
          spec: ${{ steps.set-target.outputs.test_file_unit }}
        env:
          NODE_ENV: development

      - name: Ejecutar prueba de integración (E2E)
        if: steps.set-target.outputs.run_integration == 'true'
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          spec: ${{ steps.set-target.outputs.test_file_int }}
        env:
          NODE_ENV: test
        
      - name: Guardar Capturas de Pantalla (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
